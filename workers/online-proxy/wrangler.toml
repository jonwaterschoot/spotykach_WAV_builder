name = "wavbuilder-online"
main = "src/index.js"
compatibility_date = "2025-10-01"

# Live at https://wavbuilder-online.jonwtr.workers.dev. Said explicitly so deploy
# stops warning about it. No preview URLs: every deploy is the one the app uses.
workers_dev = true
preview_urls = false

# The pages allowed to use the proxy: the live site, and the dev server.
# The live site is GitHub Pages; an origin is scheme + host only, no path.
[vars]
ALLOWED_ORIGINS = "https://jonwaterschoot.github.io,http://localhost:5173,http://localhost:4173"

# Per-visitor rate: 15 searches a minute per IP. Counted per Cloudflare
# location and approximate by design, which is fine for "stop a runaway loop".
[[ratelimits]]
name = "SEARCH_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 15
  period = 60

# FREESOUND_KEY is a secret, not a var: `npx wrangler secret put FREESOUND_KEY`.
